<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
  input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; margin-top: 8px; }
  #result { margin-top: 16px; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
</style>
</head>
<body>

<h2>Register</h2>
<input id="regName" placeholder="Username">
<input id="regPassword" type="password" placeholder="Password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="loginName" placeholder="Username">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<div id="result"></div>

<h2>Tasks</h2>
<input id="taskTitle" placeholder="New task title">
<button onclick="createTask()">Add Task</button>
<button onclick="loadTasks()">Refresh Tasks</button>
<ul id="taskList"></ul>

<script>
  const API_URL = window.location.origin;

  async function register() {
    const name = document.getElementById('regName').value;
    const password = document.getElementById('regPassword').value;
    const res = await fetch(`${API_URL}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password })
    });
    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
  }

  async function login() {
    const name = document.getElementById('loginName').value;
    const password = document.getElementById('loginPassword').value;
    const res = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password })
    });
    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    if (data.token) {
      localStorage.setItem('token', data.token);
      loadTasks(); // auto-load tasks right after login
    }
  }

  async function createTask() {
    const title = document.getElementById('taskTitle').value;
    const token = localStorage.getItem('token');

    if (!token) {
      alert('Please login first');
      return;
    }

    const res = await fetch(`${API_URL}/tasks`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ title })
    });
    const data = await res.json();
    document.getElementById('taskTitle').value = '';
    loadTasks(); // refresh the list after adding
  }

  async function loadTasks() {
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Please login first');
      return;
    }

    const res = await fetch(`${API_URL}/tasks`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const tasks = await res.json();

    const list = document.getElementById('taskList');
    list.innerHTML = '';
    tasks.forEach(task => {
      const li = document.createElement('li');
      li.textContent = `${task.title} ${task.completed ? '✅' : ''}`;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
